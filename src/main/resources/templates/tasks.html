<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, rgba(90, 85, 174, 1) 0%, rgba(16, 16, 35, 1) 90%);
            --card-bg: rgba(25, 28, 50, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            margin: 0;
            overflow-x: hidden;
        }

        .todo-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            padding: 2.5rem;
            width: 100%;
            max-width: 620px;
            transition: all 0.3s ease;
        }

        .todo-header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .todo-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Progress Bar */
        .progress-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-percent {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--success-color);
        }

        .progress-bar-custom {
            background-color: var(--success-color);
            border-radius: 4px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Input Form */
        .input-group-custom {
            display: flex;
            gap: 12px;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 20px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.25s ease;
            width: 100%;
        }

        .form-control-custom::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            outline: none;
        }

        .btn-submit-custom {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 0 24px;
            font-weight: 600;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        .btn-submit-custom:active {
            transform: translateY(0);
        }

        /* Todo Items */
        .todo-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .todo-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .todo-item.completed-item {
            background: rgba(255, 255, 255, 0.01);
            border-color: rgba(255, 255, 255, 0.02);
        }

        /* Custom Checkbox Toggle */
        .btn-toggle-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #6b7280;
            color: transparent;
            background: transparent;
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
        }

        .btn-toggle-custom:hover {
            border-color: var(--success-color);
            color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
        }

        .btn-toggle-custom.completed {
            border-color: var(--success-color);
            background: var(--success-color);
            color: #fff;
        }

        .btn-toggle-custom.completed:hover {
            background: #059669;
            border-color: #059669;
        }

        .todo-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-left: 14px;
            margin-right: auto;
            transition: all 0.25s ease;
            word-break: break-word;
        }

        .todo-title.completed {
            text-decoration: line-through;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Delete Button */
        .btn-delete-custom {
            color: var(--danger-color);
            background: rgba(239, 68, 68, 0.1);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-delete-custom:hover {
            background: var(--danger-color);
            color: #fff;
            transform: scale(1.05);
        }

        .btn-delete-custom:active {
            transform: scale(0.95);
        }

        /* Empty State */
        .empty-state {
            padding: 3rem 1.5rem;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.01);
        }
    </style>
</head>
<body>
<div class="todo-wrapper">
    <!-- Header -->
    <div class="todo-header mb-4 text-center">
        <h1 class="d-flex align-items-center justify-content-center gap-2">
            <i class="bi bi-check2-square text-indigo-400"></i> Todo Application
        </h1>
        <p>Stay organized and keep track of your daily tasks</p>
    </div>

    <!-- Input Form -->
    <form action="/" method="post" class="mb-4">
        <div class="input-group-custom">
            <input class="form-control-custom" type="text" name="title" placeholder="What needs to be done?" required autocomplete="off">
            <button type="submit" class="btn-submit-custom">
                <i class="bi bi-plus-lg"></i> Add
            </button>
        </div>
    </form>

    <!-- Task Progress Tracker -->
    <div class="progress-container mb-4" th:if="${tasks != null && tasks.size() > 0}">
        <div class="d-flex justify-content-between mb-2">
            <span class="progress-label">Task Progress</span>
            <span class="progress-percent" th:text="${tasks.?[completed].size() + ' of ' + tasks.size() + ' completed'}">0 of 0 completed</span>
        </div>
        <div class="progress" style="height: 8px; background-color: rgba(255,255,255,0.1); border-radius: 4px;">
            <div class="progress-bar-custom" role="progressbar" 
                 th:style="'width: ' + ${tasks.?[completed].size() * 100 / tasks.size()} + '%'" 
                 aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
    </div>

    <!-- Task List -->
    <div class="todo-list">
        <!-- Empty State -->
        <div class="empty-state text-center" th:if="${tasks == null || tasks.isEmpty()}">
            <div class="mb-3">
                <i class="bi bi-clipboard2-check" style="font-size: 2.5rem; color: rgba(255,255,255,0.25);"></i>
            </div>
            <h5 class="text-white-50 fs-6">No tasks yet</h5>
            <p class="text-muted small mb-0">Add a new task above to get started!</p>
        </div>

        <!-- Task Items -->
        <th:block th:each="task : ${tasks}">
            <div class="todo-item" th:classappend="${task.completed} ? 'completed-item'">
                <!-- Toggle Button (Styled Checkbox) -->
                <a th:href="@{/{id}/toggle(id=${task.id})}" 
                   class="btn-toggle-custom" 
                   th:classappend="${task.completed} ? 'completed'">
                    <i class="bi bi-check-lg" style="font-size: 14px; line-height: 1;"></i>
                </a>

                <!-- Task Title -->
                <span class="todo-title" th:classappend="${task.completed} ? 'completed'" th:text="${task.title}">Task Title</span>

                <!-- Delete Button -->
                <a th:href="@{/{id}/delete(id=${task.id})}" class="btn-delete-custom" aria-label="Delete task">
                    <i class="bi bi-trash3" style="font-size: 16px;"></i>
                </a>
            </div>
        </th:block>
    </div>
</div>
</body>
</html>
